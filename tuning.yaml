# Números de balanceamento do Milky Xmas.
#
# Como usar: aponte MILKY_TUNING_CONFIG para este arquivo antes de iniciar o bot
# (Discord ou chat local), por exemplo:
#
#   MILKY_TUNING_CONFIG=tuning.yaml go run ./src/cmd/web
#
# - Todos os valores abaixo são os padrões. Chaves removidas voltam ao padrão.
# - Chaves desconhecidas e valores fora da faixa impedem o bot de iniciar, e a
#   mensagem lista todos os problemas.
# - O arquivo é lido uma vez, na inicialização. Reinicie o bot para aplicar.
# - Durações são textos com unidade: 30s, 1m, 10m, 1h.
# - HP do boss e dano são % do HP total (100) e aceitam até 2 casas decimais (5.25).
# - Referência dos números: docs/activity-drops-numbers.md e docs/grinch-fight-numbers.md.
#
# Não são ajustáveis aqui: 8 botões por drop e por tabuleiro, a linha final de 5
# botões, o HP total do boss (100%) e o nível máximo de água da árvore (100%).

gifts:
  # Chances de raridade do gift em %. Os três somam 100.
  # Valem para /daily claim, para os gifts da Gift Rain e para o Random Active Drop
  # de quem não está na Nice list.
  daily_rarity:
    normal: 70
    rare: 25
    epic: 5
  # Bônus do Random Active Drop para quem está na Nice list (aura.nice_at).
  good_deeds_boost:
    rarity:           # chances em %, somam 100
      normal: 50
      rare: 35
      epic: 15

drops:
  lifetime: 10m       # quanto tempo um drop fica aberto (Random Active Drop e Gift Rain)

  random_active:
    one_in: 20        # aparece em 1 a cada N mensagens (20 = 5%)

  gift_rain:
    min_messages: 5       # a chuva aparece depois de min a max mensagens no canal,
    max_messages: 100     # sorteado de novo a cada chuva (limites incluídos)
    claims_to_end: 10     # coletas, de qualquer jogador, que encerram a chuva
    claim_cooldown: 1m    # espera de cada jogador entre coletas de chuva
    coal_percent: 25      # chance de a coleta dar Coal em vez de gift

grinch:
  spawn:
    check_interval: 1m          # de quanto em quanto tempo o bot sorteia a aparição
    chance_percent: 10          # chance por sorteio, em %
    activity_window: 10m        # alguém precisa ter falado no canal do boss neste prazo
    cooldown_after_fight: 30m   # intervalo mínimo depois do fim de uma luta

  registration:
    start_window: 1m        # tempo que o anúncio espera o primeiro clique em Start; sem clique, a luta é cancelada
    duration: 1m            # contagem regressiva que começa no primeiro clique em Start
    early_start_players: 3  # com este número de jogadores que apertaram Start a luta começa na hora

  fight_duration: 3m        # relógio de combate, começa quando o boss chega ao HP de snowballs.boss_hp_after

  # Quantos acertos cada fase de ataque (snowballs, ataque, final) pede: per_player para cada
  # jogador na luta, nunca menos que minimum. Com os dois em 0, valem os danos de cada fase abaixo.
  hits:
    per_player: 8
    minimum: 15
  click_cooldown: 2s            # espera de cada jogador entre duas ações na luta
  counterattack_percent: 10     # chance de o Grinch revidar em quem atacou (tira o mesmo HP de um erro na defesa)
  revive:                       # quem caiu volta gastando um gift próprio
    normal_hp_percent: 25       # HP com que volta usando um gift Normal (0 = não serve)
    rare_hp_percent: 50         # usando um Rare
    epic_hp_percent: 100        # usando um Epic
    last_chance: 20s            # com todos caídos, quanto o Grinch espera antes de vencer

  # Fase 1: cliques de snowball. O grupo tem este tempo para baixar o boss até boss_hp_after;
  # se o tempo acabar antes, o boss vence.
  snowballs:
    duration: 2m            # tempo para baixar o boss até boss_hp_after
    damage: 4.17            # HP do boss por clique: vale só com grinch.hits zerado
    boss_hp_after: 75       # a fase termina quando o boss chega a este HP

  # Fase 2: defesa. O dano total da fase (snowballs.boss_hp_after - defense.boss_hp_after)
  # é dividido entre as defesas necessárias: uma por jogador, até max_defenses.
  defense:
    boss_hp_after: 45
    miss_hp_loss_percent: 20   # % do HP máximo do jogador perdido ao errar
    max_defenses: 6            # nunca são necessárias mais defesas que isto

  # Fase 3: ataque. Os últimos golpes são cortados para não passar de boss_hp_after.
  attack:
    damage: 6.67            # HP do boss por clique em ☃️: vale só com grinch.hits zerado
    heavy_damage: 7         # HP do boss por clique em 🧊
    boss_hp_after: 5

  # Fase 4: ataque final, até o boss chegar a 0.
  final_attack:
    hit_damage: 0.84        # vale só com grinch.hits zerado
    hit_score: 2            # pontos que ⚔️ dá ao jogador (guardados para uso futuro; o ranking de dano mostra só o dano)
    gift_points:            # 🎁 dá pontos de presente sorteados nesta faixa
      min: 1
      max: 5
    snowballs_reward: 1     # Snowballs que o botão ❄️ final dá

  # Recompensa de cada jogador inscrito na fuga e na derrota.
  loss_rewards:
    coal: 1
    yellow_snowballs_per_group_member: 1   # Yellow Snowballs = nº de inscritos x este valor

# Árvore de Natal compartilhada (/water). Os níveis de água são % do nível máximo (100).
tree:
  start_level: 10         # nível de uma árvore que ninguém regou ainda
  water_points: 2         # % de água que cada rega soma
  water_aura: 1           # pontos de good deeds na aura de quem rega (0 não dá nada)
  decay_interval: 1h      # a árvore perde 1% de água a cada intervalo
  water_cooldown: 1h      # espera de cada jogador entre regas
  event_end: 2027-01-05T01:00:00Z   # data e hora UTC do fim do evento: a árvore para de secar e de ser regada

# Frases e poemas de Natal nos canais com quotes ligado (/setup channel).
quotes:
  every_messages: 3       # mensagens de jogadores no canal para sair uma frase
  min_interval: 3h        # intervalo mínimo entre duas frases no mesmo canal
                          # (every_messages: 1 vira "a cada X tempo enquanto houver conversa")

# Nice list e Naughty list: vantagens conforme a aura (de -50 a +50).
aura:
  nice_at: 25           # aura a partir da qual a pessoa está na Nice list
  naughty_at: -25       # aura a partir da qual (para baixo) está na Naughty list
  send_cooldown: 24h    # a aura só conta um envio por pessoa neste prazo, em cada direção (0s conta todos)
  daily_limit: 15       # quanto a aura sobe e quanto desce, no máximo, por dia (vira às 00:00 UTC; 0 = sem limite)
  daily_coal: 1         # Coal que o /daily claim dá a quem tem aura 0 ou menor
  nice:                 # além do bônus de raridade no Random Active Drop
    daily_extra_gifts: 1            # gifts a mais no /daily claim
    water_extra_points: 1           # % de água a mais por rega
    miss_hp_loss_percent: 34        # % de HP perdido ao errar a defesa (normal: grinch.defense)
    boss_damage_bonus_percent: 20   # % de dano a mais nos ataques ao Grinch
  naughty:
    water_less_points: 1            # % de água a menos por rega (a rega soma no mínimo 1%)
    miss_hp_loss_percent: 10        # % de HP perdido ao errar a defesa
    daily_yellow_snowballs: 1       # Yellow Snowballs a mais no /daily claim
    rain_double_percent: 25         # chance de o gift da Gift Rain vir em dobro
    rain_claim_cooldown: 30s        # espera entre coletas de Gift Rain (normal: drops.gift_rain.claim_cooldown)
    loss_coal: 0                    # Coal recebido quando o Grinch vence (normal: grinch.loss_rewards)
