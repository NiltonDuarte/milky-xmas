<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milky Xmas · Test chat</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101a19;
      color: #edf4f1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(1rem, 6vw, 4rem) 1rem; }
    main { max-width: 42rem; margin: auto; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.75rem); letter-spacing: -.04em; }
    header p { color: #b0c7c0; margin: .35rem 0 1.5rem; }
    section {
      border: 1px solid #41605a;
      border-radius: 1rem;
      background: #172523;
      overflow: hidden;
    }
    #transcript {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .85rem;
      height: clamp(14rem, 48vh, 27rem);
      overflow-y: auto;
      padding: 1.25rem;
    }
    .message {
      flex-shrink: 0;
      max-width: 90%;
      border-radius: .8rem;
      padding: .65rem .85rem;
      background: #263b36;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .you { align-self: flex-end; background: #31534a; }
    .error { background: #493134; }
    .message strong { display: block; color: #d5e5de; font-size: .8rem; margin-bottom: .25rem; }
    form {
      border-top: 1px solid #41605a;
      display: flex;
      gap: .6rem;
      padding: .85rem;
    }
    input, button { font: inherit; border-radius: .6rem; padding: .65rem .8rem; }
    input {
      width: 100%;
      min-width: 0;
      border: 1px solid #526c66;
      color: inherit;
      background: #101a19;
      font-family: ui-monospace, monospace;
    }
    input::placeholder { color: #a4b8b1; }
    button { border: 0; background: #bcebd0; color: #142c22; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 2px solid #bcf2d3; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Milky Xmas</h1>
      <p>Local test chat</p>
    </header>
    <section aria-label="Chat">
      <div id="transcript" role="log" aria-label="Chat transcript" tabindex="0"></div>
      <form action="/chat" method="post">
        <input name="command" aria-label="Command" placeholder="/daily claim, /send gift, or /look in-your-stocking" maxlength="256" required autocomplete="off" spellcheck="false">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script>
    const transcript = document.querySelector("#transcript");
    const form = document.querySelector("form");
    const input = form.elements.command;
    const send = form.querySelector("button");

    function appendMessage(label, text, style) {
      const message = document.createElement("div");
      message.className = "message " + style;
      const author = document.createElement("strong");
      author.textContent = label;
      message.append(author, document.createTextNode(text));
      transcript.append(message);
      transcript.scrollTop = transcript.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (send.disabled) return;

      const command = input.value;
      input.value = "";
      send.disabled = true;
      input.focus();
      appendMessage("You", command, "you");

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new URLSearchParams({command}),
        });
        appendMessage(response.ok ? "Milky Xmas" : "Error", await response.text(), response.ok ? "bot" : "error");
      } catch {
        appendMessage("Error", "The local server could not be reached. Try again.", "error");
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
